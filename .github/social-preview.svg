<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Source of .github/social-preview.png (1280×640, the size GitHub asks for the repository's social
       preview). Same drawing as docs/social-preview.svg, centred for this format. Render with a headless
       browser at 1280×640; upload the PNG under Settings → Social preview. -->
  <rect width="1280" height="640" fill="#2B3238"/>
  <g transform="translate(335 345)">
    <circle r="137" fill="none" stroke="#FFFFFF" stroke-width="58"/>
    <circle cx="96" cy="-96" r="34" fill="#2B3238"/>
    <circle cx="167" cy="-167" r="27" fill="#FF6B4A"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
    <text x="625" y="297" font-size="100" font-weight="700" letter-spacing="-1"><tspan fill="#AEB6C0">Zero</tspan><tspan fill="#FF6B4A">punch</tspan></text>
    <text x="629" y="373" font-size="40" font-weight="500" fill="#E9EDF2">A punch clock that</text>
    <text x="629" y="425" font-size="40" font-weight="500" fill="#E9EDF2">knows nothing about you.</text>
    <text x="629" y="505" font-size="26" font-weight="500" fill="#AEB6C0">zeropunch.app · free software, AGPL-3.0</text>
  </g>
</svg>
